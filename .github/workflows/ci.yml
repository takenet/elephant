name: CI

on:
  pull_request:
    branches: [master, main, 'beta/*']
  push:
    branches: [master, main, 'beta/*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to nuget.org (only on master/main)'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: src/Take.Elephant.sln
  # Azure DevOps pipeline uses 0.10.<rev>; use a distinct prefix to avoid version clashes
  VERSION_PREFIX: '0.11'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} --configuration Release --no-build
          --filter "Category=Memory"
          --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  pack:
    # Manual runs only, from the main branch
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Pack
        run: >
          dotnet pack ${{ env.SOLUTION }} --configuration Release
          -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*nupkg

      - name: NuGet login (trusted publishing)
        if: ${{ inputs.publish }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: ${{ inputs.publish }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
